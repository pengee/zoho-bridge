[project]
name = "zoho-bridge"
version = "0.1.0"
description = "Local IMAP/SMTP bridge for Zoho Mail free tier, over the official Zoho Mail REST API"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pymap>=0.36.7,<0.37",
    "aiosmtpd>=1.4.6,<2",
    "httpx>=0.28,<1",
    "cryptography>=43,<46",
]

[project.entry-points."pymap.backend"]
zoho = "zoho_bridge.imap.backend:ZohoBackend"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "aiohttp>=3.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zoho_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
